[project]
name = "back"
version = "0.1.0"
description = "주식 AI 분석 백엔드 (FastAPI · 비동기 · 멀티 에이전트)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.118",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0.36",
    "httpx>=0.28",
    # 1.5 에서 추가된 get_valuation_measures() 가 필요하다. 국내 종목(.KS/.KQ)은
    # info["trailingPE"]/["priceToBook"] 가 항상 None 이라 PER/PBR 의 유일한 소스다.
    # 핀을 낮추면 오류 없이 조용히 전 종목 null 이 된다.
    "yfinance>=1.5",
    "alembic>=1.18.5",
    # **유일한 DB 드라이버다.** 한때 psycopg2-binary·psycopg[binary]·psycopg2 가 함께
    # 선언돼 있었는데 셋 다 import 되는 곳이 없었다 — alembic 도 async 엔진(asyncpg)으로
    # 돈다(`alembic/env.py`).
    #
    # 비바이너리 `psycopg2` 는 그냥 남는 짐이 아니라 **깨진 상태**였다. PyPI 에 리눅스
    # 휠이 0개(sdist 뿐)라 `python:3.12-slim` 에서 소스 빌드로 떨어지는데, 그 이미지에는
    # gcc·libpq-dev 가 없다. 윈도우에는 휠이 있어 로컬만 조용히 통과한다.
    #
    # 동기 드라이버가 다시 필요해지는 시점은 langgraph 체크포인터(`AsyncPostgresSaver`)를
    # 붙일 때이고, 그때 psycopg2 가 아니라 psycopg[binary] 를 그 이유와 함께 추가한다.
    "asyncpg>=0.31.0",
    "python-dotenv>=1.2.2",
    "pykrx>=1.2.8",
    "google-genai>=1.0",
    "langgraph>=0.6",
    "pgvector>=0.3",
]

# `fastapi dev` / `fastapi run`이 파일명 탐색 순서(main.py → app/main.py → …)에
# 의존하지 않도록 진입점을 명시한다. 루트에 다른 main.py가 생겨도 흔들리지 않는다.
[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 테스트 Postgres 엔진(`pg_engine`)은 세션 스코프다 — 스키마를 273번 다시 만들 수
# 없기 때문이다. asyncpg 커넥션은 **자기를 만든 이벤트 루프에서만** 쓸 수 있으므로,
# 세션 픽스처와 테스트가 같은 루프를 공유해야 한다. 둘 다 session 으로 맞춘다.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 100
# _legacy/는 app/으로 이관이 끝난 원본 보관소다. 실행되지 않으므로 린트하지 않는다.
extend-exclude = ["_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# 프롬프트 원문은 문장 중간에서 줄바꿈하면 오히려 읽기 어렵다.
"app/agents/prompts.py" = ["E501"]
