[project]
name = "back"
version = "0.1.0"
description = "주식 AI 분석 백엔드 (FastAPI · 비동기 · 멀티 에이전트)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.118",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0.36",
    "httpx>=0.28",
    # 1.5 에서 추가된 get_valuation_measures() 가 필요하다. 국내 종목(.KS/.KQ)은
    # info["trailingPE"]/["priceToBook"] 가 항상 None 이라 PER/PBR 의 유일한 소스다.
    # 핀을 낮추면 오류 없이 조용히 전 종목 null 이 된다.
    "yfinance>=1.5",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "fastapi-pagination>=0.15.16",
    "pykrx>=1.2.8",
    "psycopg[binary]>=3.2",
    "google-genai>=1.0",
    "langgraph>=0.6",
]

[project.optional-dependencies]
# asyncpg 는 이제 필수 의존성이다 (주 DB 가 Postgres 전용). 이 extra 는 예전
# `uv sync --extra postgres` 문서를 따라오는 사람을 위해 남겨 둔 빈 껍데기다.
postgres = ["asyncpg>=0.30"]

# `fastapi dev` / `fastapi run`이 파일명 탐색 순서(main.py → app/main.py → …)에
# 의존하지 않도록 진입점을 명시한다. 루트에 다른 main.py가 생겨도 흔들리지 않는다.
[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    # **테스트 하네스 전용.** 운영 의존성에서 뺐다 — 배포되는 앱에는 SQLite 경로가
    # 없다. 테스트는 인메모리 SQLite 로 도는데, 그 대가로 방언 차이는 잡지 못한다
    # (tests/conftest.py 의 `db_session` 주석).
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 테스트 Postgres 엔진(`pg_engine`)은 세션 스코프다 — 스키마를 273번 다시 만들 수
# 없기 때문이다. asyncpg 커넥션은 **자기를 만든 이벤트 루프에서만** 쓸 수 있으므로,
# 세션 픽스처와 테스트가 같은 루프를 공유해야 한다. 둘 다 session 으로 맞춘다.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 100
# _legacy/는 app/으로 이관이 끝난 원본 보관소다. 실행되지 않으므로 린트하지 않는다.
extend-exclude = ["_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# 프롬프트 원문은 문장 중간에서 줄바꿈하면 오히려 읽기 어렵다.
"app/agents/prompts.py" = ["E501"]
